<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<style>
  :root {
    --ink: #1b1b1f;
    --paper: #f6f5f2;
    --line: #d8d5cd;
    --accent: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .status {
    font-size: 15px;
    color: #6b6a66;
    margin-bottom: 24px;
  }
  #ad-slot {
    /* Popunder scripts don't render visibly — this div just
       needs to contain the script tag somewhere on the page. */
    display: none;
  }
  .btn {
    display: inline-block;
    padding: 14px 32px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 16px;
    cursor: pointer;
  }
</style>
</head>
<body>

<div class="card">
  <div class="status">Tap Continue to reach your link</div>

  <!-- AD_SLOT_START -->
  <!-- Paste your ad network's on-click popunder <script> tag
       here. It attaches its own click-listener to the page
       and will fire on the genuine tap below. -->
  <div id="ad-slot">
    <script>(function(s){s.dataset.zone='11552461',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  </div>
  <!-- AD_SLOT_END -->

  <button class="btn" id="continueBtn">Continue</button>
</div>

<script>
  /* =================================================== */
  /* DESTINATION — your real site.                          */
  /* =================================================== */
  const DESTINATION_URL = "https://iliteshopgha.wuaze.com";

  const btn = document.getElementById("continueBtn");
  let tapped = false;
  let redirected = false;

  function goToDestination() {
    if (redirected) return;
    redirected = true;
    window.location.href = DESTINATION_URL;
  }

  // First genuine tap: the popunder script (in #ad-slot) fires
  // naturally off this real click, since it opens in a new
  // window behind this one.
  btn.addEventListener("click", () => {
    tapped = true;
    btn.textContent = "Continue";
  });

  // When the visitor comes back to this tab (after the popunder
  // window opened behind it), auto-continue to the real site.
  document.addEventListener("visibilitychange", () => {
    if (tapped && document.visibilityState === "visible") {
      goToDestination();
    }
  });

  // Fallback for browsers/desktops where visibility doesn't
  // change (popunder opens behind without blurring this tab):
  // auto-continue a couple seconds after the first tap anyway.
  btn.addEventListener("click", () => {
    setTimeout(goToDestination, 2000);
  });
</script>

</body>
</html>
