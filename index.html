<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Redirecting…</title>
<style>
  :root {
    --ink: #1b1b1f;
    --paper: #f6f5f2;
    --line: #d8d5cd;
    --accent: #2f5d50;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--paper);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    padding: 24px;
  }
  .card {
    width: 100%;
    max-width: 420px;
    text-align: center;
  }
  .status {
    font-size: 15px;
    color: #6b6a66;
    margin-bottom: 18px;
  }
  #ad-slot {
    border: 1px dashed var(--line);
    border-radius: 4px;
    overflow: hidden;
    margin-bottom: 24px;
    background: #fff;
  }
  #ad-slot iframe {
    width: 100%;
    height: 550px;
    border: none;
    display: block;
  }
  .timer {
    font-size: 40px;
    font-variant-numeric: tabular-nums;
    margin-bottom: 20px;
  }
  .btn {
    display: inline-block;
    padding: 12px 28px;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 4px;
    font-size: 15px;
    cursor: not-allowed;
    opacity: 0.5;
    transition: opacity 0.2s;
  }
  .btn.ready {
    cursor: pointer;
    opacity: 1;
  }
</style>
</head>
<body>

<div class="card">
  <div class="status">Your link will be ready shortly</div>

  <!-- AD_SLOT_START -->
  <div id="ad-slot">
    <iframe src="https://tinyurl.com/2hesdftn"></iframe>
  </div>
  <!-- AD_SLOT_END -->

  <div class="timer" id="timer">5</div>
  <button class="btn" id="continueBtn" disabled>Continue</button>
</div>

<script>
  /* =================================================== */
  /* DESTINATION — the real page you want people to       */
  /* end up on after the wait.                             */
  /* =================================================== */
  const DESTINATION_URL = "https://iliteshopgha.wuaze.com";

  /* How long to make them wait before Continue unlocks, in seconds */
  const WAIT_SECONDS = 8;

  let remaining = WAIT_SECONDS;
  const timerEl = document.getElementById("timer");
  const btn = document.getElementById("continueBtn");

  const interval = setInterval(() => {
    remaining -= 1;
    timerEl.textContent = remaining;
    if (remaining <= 0) {
      clearInterval(interval);
      timerEl.textContent = "Ready";
      btn.disabled = false;
      btn.classList.add("ready");
    }
  }, 1000);

  btn.addEventListener("click", () => {
    if (!btn.classList.contains("ready")) return;
    window.location.href = DESTINATION_URL;
  });
</script>

</body>
</html>
